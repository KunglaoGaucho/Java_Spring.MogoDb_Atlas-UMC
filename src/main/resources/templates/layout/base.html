<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE · $LAYOUT_TITLE" th:text="${marca.nome}">Sentinela</title>
    <!-- Estrutura (não muda entre temas) -->
    <link rel="stylesheet" th:href="@{/assets/css/base.css}">
    <!-- Tema: apenas variáveis de cor/forma. Trocar de tema = trocar este arquivo. -->
    <link rel="stylesheet" th:href="@{/themes/{id}/theme.css(id=${tema})}">
    <script th:src="@{/assets/js/app.js}" defer></script>
</head>
<body th:attr="data-tema=${tema}">
    <a class="pular" href="#conteudo">Pular para o conteúdo</a>
    <header th:replace="~{fragmentos/cabecalho :: cabecalho}"></header>

    <main id="conteudo" class="container">
        <div th:replace="~{fragmentos/alertas :: alertas}"></div>
        <section layout:fragment="conteudo"></section>
    </main>

    <footer th:replace="~{fragmentos/rodape :: rodape}"></footer>
</body>
</html>
