<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layout/base}">
<head><title>Entrar</title></head>
<body>
<section layout:fragment="conteudo" class="caixa-auth">
    <h1>Entrar</h1>
    <p class="suave">Use o e-mail e a senha da sua conta.</p>

    <p class="alerta alerta--erro" role="alert" th:if="${param.erro}">
        E-mail ou senha inválidos, ou conta indisponível. Após várias tentativas, a conta é bloqueada temporariamente.
    </p>
    <p class="alerta alerta--sucesso" role="status" th:if="${param.saiu}">Você saiu com segurança.</p>

    <form th:action="@{/entrar}" method="post" class="formulario">
        <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" autocomplete="username" required autofocus>
        </div>
        <div class="campo">
            <label for="senha">Senha</label>
            <div class="campo__senha">
                <input type="password" id="senha" name="senha" autocomplete="current-password" required>
                <button type="button" class="botao-icone" data-alternar-senha aria-controls="senha"
                        aria-label="Mostrar senha">👁</button>
            </div>
        </div>
        <button type="submit" class="botao botao--largo">Entrar</button>
    </form>
    <p class="rodape-form">Ainda não tem conta? <a th:href="@{/cadastro}">Cadastre-se</a></p>
</section>
</body>
</html>
